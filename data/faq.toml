## 자주 묻는 질문 데이터. 문항 4개(위치·영업시간·연락 방법·가격대), 템플릿은 layouts/home.html에서 순회한다.

[[items]]
question = "낙성대 하이퍼블릭 에르는 정확히 어디에 있나요?"
answer = "에르는 서울 관악구 봉천동, 낙성대역에서 멀지 않은 자리에서 하이퍼블릭으로 운영되고 있습니다."

[[items]]
question = "에르 운영 시간대가 어떻게 되나요?"
answer = "에르는 매일 18:00부터 다음날 15:00까지 영업하며, 세 시간의 청소 시간을 제외하면 매일 문을 엽니다. 공휴일 운영은 전화로 다시 확인해 주세요."

[[items]]
question = "에르에 연락하는 방법이 궁금합니다."
answer = "에르 예약 및 상담은 전화 010-7456-5410, 텔레그램 ggyuvely로 가능합니다."

[[items]]
question = "에르 이용 요금대는 어떻게 되나요?"
answer = "에르는 1인 200,000원, 2인 300,000원, 3인 420,000원, 4인 560,000원의 기본 요금표를 쓰고 있으며 추가 주문 시 그만큼만 더해집니다."
