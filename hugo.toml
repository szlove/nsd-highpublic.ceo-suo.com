baseURL = 'https://nsd-highpublic.ceo-suo.com/'
languageCode = 'ko-KR'
title = '낙성대 하이퍼블릭 에르 할인 정보'

[params]
  isAdsEnabled = true
  adsTelegramId = "ggyuvely"

  description = '낙성대 하이퍼블릭 에르(ER)는 서울 관악구 봉천동에 있습니다.'
  author = '에르'
  datePublished = "2026-08-18T08:10:00+09:00"
  dateModified = "2026-08-18T08:10:00+09:00"
  [params.store]
	tel = "010-7456-5410"
  location = "낙성대"
	locationEn = "NSD"
  name = "에르"
	nameEn = "ER"
	nameIs = "는"
	category = "하이퍼블릭"
	categoryEn = "Highpublic"
	categoryIs = "는"
	address = "서울 관악구 봉천동"
	googleMapSrc = "https://www.google.com/maps?q=서울+관악구+봉천동&output=embed"

enableRobotsTXT = false
cleanDestinationDir = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
